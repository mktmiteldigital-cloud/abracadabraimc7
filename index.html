<body>
    <div class="container">
        <div class="header">
            <h1>AbracadabraIMC⁷</h1>
            <p>Inteligência Coordenada supera Inteligência Isolada</p>
            <p id="timestamp" style="color: #00ff41; margin-top: 10px;"></p>
        </div>
        
        <!-- LOGIN SECTION -->
        <div class="login-section active">
            <div class="login-form">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>
                <button class="btn" onclick="handleLogin()">Entrar</button>
                <div id="loginError"></div>
            </div>
        </div>
        
        <!-- BOOT SECTION -->
        <div class="boot-section">
            <div class="boot-container">
                <h2 style="color: #ffd700; margin-bottom: 20px;">🔄 INICIALIZANDO SISTEMA</h2>
                <div class="boot-progress">
                    <div class="boot-bar">
                        <div class="boot-fill" id="bootFill" style="width: 0%;">0%</div>
                    </div>
                </div>
                <div class="boot-status" id="bootStatus">Preparando ambiente...</div>
                <button class="btn" id="enterBtn" style="display: none;" onclick="enterSala()">Entrar na Sala</button>
            </div>
        </div>
        
        <!-- SALA SECTION -->
        <div class="sala-section">
            <div class="sala-header">
                <div>
                    <div class="sala-title">SALA DE INTELIGÊNCIA</div>
                    <div class="sala-info" id="salaInfo">Operador: carregando...</div>
                </div>
                <button class="btn" style="width: auto; padding: 8px 15px;" onclick="handleLogout()">Sair</button>
            </div>
            
            <div class="nicho-selector">
                <div style="color: #00d4ff; margin-bottom: 10px; font-size: 12px;">Selecione o Nicho:</div>
                <button class="nicho-btn active" onclick="changeNicho('Projeto')">Projeto</button>
                <button class="nicho-btn" onclick="changeNicho('Jurídico')">Jurídico</button>
                <button class="nicho-btn" onclick="changeNicho('Tecnologia')">Tecnologia</button>
                <button class="nicho-btn" onclick="changeNicho('Livre')">Livre</button>
            </div>
            
            <div class="sentinela-selector">
                <div style="color: #00d4ff; margin-bottom: 10px; font-size: 12px;">Coordenador:</div>
                <button class="sentinela-btn active" onclick="selectSentinela('CG')">CG (Gideão)</button>
                <button class="sentinela-btn" onclick="selectSentinela('DS')">DS (Serafim)</button>
                <button class="sentinela-btn" onclick="selectSentinela('GA')">GA (Arcanjos)</button>
                <button class="sentinela-btn" onclick="selectSentinela('PM')">PM (Profeta)</button>
            </div>
            
            <div class="chat-container" id="chatContainer"></div>
            
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="handleMessageKeypress(event)">
                <button class="btn" style="width: auto; padding: 10px 20px;" onclick="sendMessage()">Enviar</button>
            </div>
            
            <div id="salaMessages"></div>
        </div>
    </div>
    
    <!-- Modal Continuar ou Novo -->
    <div class="modal" id="continuarModal">
        <h2>Bem-vindo de volta</h2>
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-buttons">
            <button class="btn" onclick="continuarOrinAnterior()">Continuar</button>
            <button class="btn" onclick="novoORIN()">Novo ORIN</button>
        </div>
    </div>
    
    <script>
        // ═══════════════════════════════════════════════════════════════════════════════
        // VERSIONAMENTO E RASTREABILIDADE
        // ═══════════════════════════════════════════════════════════════════════════════
        
        const VERSION_INFO = {
            index: "4.10",
            indexFull: "4.10-mapa1-persistencia",
            workerRequired: "7.2+",
            schemaVersion: "profile-1.0",
            deploymentDate: "27/05/2026",
            status: "PRODUCTION READY",
            mapa1: "INTEGRADO COMPLETO",
            compatibilidade: {
                worker: "7.2+",
                profile: "1.0",
                endpoint: "/profile"
            }
        };
        
        // ═══════════════════════════════════════════════════════════════════════════════
        // STATE GLOBAL
        // ═══════════════════════════════════════════════════════════════════════════════
        
        const state = {
            email: localStorage.getItem('email') || '',
            sentinela: localStorage.getItem('sentinela') || 'CG',
            nicho: localStorage.getItem('nicho') || 'Projeto',
            plano: 'operador',
            timerSeconds: undefined,
            orinAtivo: null,
            profile: null,
            messages: [],
            SALA_STATE: {
                fase: 'CONFIRMACAO',
                rankingAtual: [
                    { id: 'CG', nome: 'Claude Gideão' },
                    { id: 'DS', nome: 'Dola Serafim' },
                    { id: 'GA', nome: 'Gemini Arcanjos' },
                    { id: 'PM', nome: 'Profeta Metodológico' }
                ]
            },
            sentinelaNome: 'Claude Gideão',
            red: { permitido: false, ativo: false }
        };
        
        // ═══════════════════════════════════════════════════════════════════════════════
        // MAPA 1: FUNÇÕES DE PROFILE
        // ═══════════════════════════════════════════════════════════════════════════════
        
        async function recuperarProfile(email) {
            try {
                const res = await fetch('/profile?email=' + encodeURIComponent(email));
                
                if (!res.ok) {
                    console.error('recuperarProfile: HTTP', res.status);
                    return null;
                }
                
                const data = await res.json();
                
                if (data.status !== 'ok') {
                    console.error('recuperarProfile erro:', data.mensagem);
                    return null;
                }
                
                if (!data.profile || typeof data.profile !== 'object') {
                    console.error('recuperarProfile: profile inválido');
                    return null;
                }
                
                if (!data.profile.email || !Array.isArray(data.profile.ORINsAtivos)) {
                    console.error('recuperarProfile: estrutura corrompida');
                    return null;
                }
                
                console.log('recuperarProfile: validação OK');
                return data.profile;
                
            } catch (err) {
                console.error('recuperarProfile erro crítico:', err.message);
                return null;
            }
        }
        
        function exibirPerfil(profile) {
            if (!profile) {
                console.log('Nenhum profile para exibir');
                return;
            }
            
            let profileContainer = document.getElementById('profile-container');
            if (!profileContainer) {
                profileContainer = document.createElement('div');
                profileContainer.id = 'profile-container';
                document.body.appendChild(profileContainer);
            }
            
            const ultimasORINs = profile.ORINsAtivos 
                ? profile.ORINsAtivos.slice(-3).reverse().map(o => 
                    `<div style="margin: 8px 0; padding: 8px; border-left: 3px solid #00ff41; background: rgba(0,255,65,0.05);">
                      <div style="color: #ffd700; font-weight: bold;">${o.orin}</div>
                      <div style="color: #00d4ff; font-size: 11px;">${o.timestamp}</div>
                      <div style="color: #888; font-size: 11px;">${o.nicho} · ${o.sentinela}</div>
                    </div>`)
                  .join('')
                : '<div style="color: #888;">Nenhuma sessão</div>';
            
            profileContainer.innerHTML = `
                <div style="border-bottom: 1px solid #00d4ff; padding-bottom: 10px; margin-bottom: 10px;">
                    <div style="color: #ffd700; font-weight: bold;">${profile.displayName}</div>
                    <div style="color: #00d4ff; font-size: 11px;">${profile.email}</div>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <div style="color: #888; font-size: 11px;">Sessões: <span style="color: #00ff41;">${profile.sessoesTotais}</span></div>
                    <div style="color: #888; font-size: 11px;">ORINs: <span style="color: #00ff41;">${profile.orinsTotais}</span></div>
                </div>
                
                <div style="border-top: 1px solid #333; padding-top: 10px;">
                    <div style="color: #888; font-size: 11px; margin-bottom: 8px;">ÚLTIMAS:</div>
                    ${ultimasORINs}
                </div>
            `;
        }
        
        function ofererecerContinuarOuNovo(profile) {
            if (!profile.ultimoORIN) {
                console.log('Nenhum ORIN anterior');
                return;
            }
            
            const ultimaSessao = profile.ultimaSessao;
            const modal = document.getElementById('continuarModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div>Último ORIN:</div>
                <div style="color: #ffd700; margin: 10px 0; font-weight: bold;">
                    ${ultimaSessao.orin}
                </div>
                <div style="color: #888; font-size: 11px;">
                    ${ultimaSessao.timestamp} · ${ultimaSessao.nicho}
                </div>
            `;
            
            modal.classList.add('active');
        }
        
        function continuarOrinAnterior() {
            if (state.profile && state.profile.ultimaSessao) {
                state.orinAtivo = state.profile.ultimaSessao.orin;
                state.nicho = state.profile.ultimaSessao.nicho;
                state.sentinela = state.profile.ultimaSessao.sentinela;
                document.getElementById('continuarModal').classList.remove('active');
                iniciarProtocoloEntrada();
            }
        }
        
        function novoORIN() {
            document.getElementById('continuarModal').classList.remove('active');
            ptGerarORIN();
        }
        
        async function bootComProfile() {
            const profile = await recuperarProfile(state.email);
            
            if (profile) {
                state.profile = profile;
                exibirPerfil(profile);
                
                if (profile.ultimoORIN) {
                    setTimeout(() => {
                        ofererecerContinuarOuNovo(profile);
                    }, 800);
                }
            }
        }
        
        // ═══════════════════════════════════════════════════════════════════════════════
        // FUNÇÕES CORE
        // ═══════════════════════════════════════════════════════════════════════════════
        
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                now.toLocaleDateString('pt-BR') + ' · ' + 
                now.toLocaleTimeString('pt-BR') + ' · Brasília';
        }
        
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!email || !password) {
                showError('loginError', 'Email e senha são obrigatórios');
                return;
            }
            
            state.email = email;
            localStorage.setItem('email', email);
            localStorage.setItem('sentinela', state.sentinela);
            localStorage.setItem('nicho', state.nicho);
            
            showSection('boot-section');
            startBoot();
        }
        
        function startBoot() {
            const bootFill = document.getElementById('bootFill');
            const bootStatus = document.getElementById('bootStatus');
            const enterBtn = document.getElementById('enterBtn');
            
            let percentage = 0;
            const BOOT_EF_ATIVAS = 5;
            const BOOT_EF_TOTAL = 7;
            
            const messages = [
                'Inicializando IA⁷...',
                'Carregando Sentinelas...',
                'Preparando coordenação...',
                'Validando persistência...',
                'Conectando ao R2...',
                'Carregando Profile...',
                'SISTEMA PRONTO · SHALOM'
            ];
            
            let messageIndex = 0;
            
            const interval = setInterval(() => {
                percentage += Math.random() * 15 + 5;
                if (percentage > 100) percentage = 100;
                
                bootFill.style.width = percentage + '%';
                bootFill.textContent = Math.round(percentage) + '%';
                
                if (messageIndex < messages.length) {
                    bootStatus.textContent = messages[messageIndex];
                    messageIndex++;
                }
                
                if (percentage >= 100) {
                    clearInterval(interval);
                    bootFill.style.width = '100%';
                    bootFill.textContent = '100%';
                    bootStatus.textContent = 'SISTEMA PRONTO · SHALOM';
                    enterBtn.style.display = 'block';
                    
                    // MAPA 1: Carregar profile após boot
                    bootComProfile();
                }
            }, 300);
        }
        
        function enterSala() {
            showSection('sala-section');
            updateSalaInfo();
        }
        
        function updateSalaInfo() {
            const info = document.getElementById('salaInfo');
            info.textContent = `Operador: ${state.email} | Nicho: ${state.nicho} | Coordenador: ${state.sentinela}`;
        }
        
        function selectSentinela(sentinelaId) {
            state.sentinela = sentinelaId;
            localStorage.setItem('sentinela', sentinelaId);
            
            document.querySelectorAll('.sentinela-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateSalaInfo();
        }
        
        function changeNicho(novoNicho) {
            state.nicho = novoNicho;
            localStorage.setItem('nicho', novoNicho);
            
            document.querySelectorAll('.nicho-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateSalaInfo();
        }
        
        function ptGerarORIN() {
            const hoje = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const sequencial = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            state.orinAtivo = `ORIN-${state.nicho.toUpperCase()}-${hoje}-${sequencial}`;
            
            addMsg('system', `ORIN Gerado: ${state.orinAtivo}`);
            iniciarProtocoloEntrada();
        }
        
        function iniciarProtocoloEntrada() {
            state.SALA_STATE.fase = 'OPERACIONAL';
            
            if (state.SALA_STATE.rankingAtual && state.SALA_STATE.rankingAtual.length > 0) {
                const top = state.SALA_STATE.rankingAtual[0];
                const pergunta = `Confirma ${top.nome} como sentinela coordenadora desta sessão? (SIM/NÃO)`;
                addMsg('system', pergunta);
            }
        }
        
        function addMsg(role, content) {
            const msg = { role, content, timestamp: new Date().toLocaleTimeString('pt-BR') };
            state.messages.push(msg);
            
            const chatContainer = document.getElementById('chatContainer');
            const msgEl = document.createElement('div');
            msgEl.className = `chat-message ${role}`;
            msgEl.textContent = `[${msg.timestamp}] ${role.toUpperCase()}: ${content}`;
            chatContainer.appendChild(msgEl);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMsg('operador', text);
            input.value = '';
            
            if (!state.orinAtivo) {
                ptGerarORIN();
            } else {
                procesarMensagemComSentinela(text);
            }
        }
        
        function handleMessageKeypress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function procesarMensagemComSentinela(text) {
            setTimeout(() => {
                const responses = [
                    'Entendido. Analisando contexto...',
                    'Processado. Coordenando com sentinelas.',
                    'Confirmado. Armazenando em QueruM.',
                    'Processamento concluído.'
                ];
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMsg(state.sentinela, response);
            }, 500);
        }
        
        function handleLogout() {
            localStorage.clear();
            location.reload();
        }
        
        function showSection(sectionId) {
            document.querySelectorAll('.login-section, .boot-section, .sala-section').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector('.' + sectionId).classList.add('active');
        }
        
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = `<div class="error-message">${message}</div>`;
            }
        }
        
        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = `<div class="success-message">${message}</div>`;
            }
        }
        
        // ═══════════════════════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════════════════════
        
        window.addEventListener('load', () => {
            // Logar versionamento para rastreabilidade
            console.log('═══════════════════════════════════════════════════════════════');
            console.log('ABRACADABRAIMC⁷ — RASTREABILIDADE DE VERSÃO');
            console.log('═══════════════════════════════════════════════════════════════');
            console.log('Index Version:', VERSION_INFO.indexFull);
            console.log('Worker Required:', VERSION_INFO.workerRequired);
            console.log('Schema Version:', VERSION_INFO.schemaVersion);
            console.log('Deployment Date:', VERSION_INFO.deploymentDate);
            console.log('Status:', VERSION_INFO.status);
            console.log('Mapa 1:', VERSION_INFO.mapa1);
            console.log('═══════════════════════════════════════════════════════════════');
            console.log('COMPATIBILIDADE:');
            console.log('  ✓ Endpoint /profile:', VERSION_INFO.compatibilidade.endpoint);
            console.log('  ✓ Worker Compatível:', VERSION_INFO.compatibilidade.worker);
            console.log('  ✓ Profile Schema:', VERSION_INFO.compatibilidade.profile);
            console.log('═══════════════════════════════════════════════════════════════');
            
            updateTimestamp();
            setInterval(updateTimestamp, 1000);
            
            if (state.email) {
                showSection('sala-section');
                updateSalaInfo();
                bootComProfile();
            }
        });
    </script>
